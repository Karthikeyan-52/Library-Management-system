<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Management - Books</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div class="container">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">

        <h2>📚 Library</h2>

        <ul>

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="books.html">
                    Books
                </a>
            </li>

            <li>
                <a href="members.html">
                    Members
                </a>
            </li>

            <li>
                <a href="issue.html">
                    Issue / Return
                </a>
            </li>

        </ul>

    </aside>



    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main-content">


        <!-- TOP BAR -->

        <div class="topbar">

            <h1>
                Book Management
            </h1>

            <span>
                Library Management System
            </span>

        </div>



        <!-- =====================================
             ADD / UPDATE BOOK FORM
        ====================================== -->

        <div class="form-container">

            <h2>
                Add / Update Book
            </h2>


            <!-- Hidden Book ID -->

            <input
                type="hidden"
                id="bookId"
            >


            <!-- Title -->

            <div class="form-group">

                <label for="title">
                    Book Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter book title"
                >

            </div>


            <!-- Author -->

            <div class="form-group">

                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter author name"
                >

            </div>


            <!-- ISBN -->

            <div class="form-group">

                <label for="isbn">
                    ISBN
                </label>

                <input
                    type="text"
                    id="isbn"
                    placeholder="Enter ISBN"
                >

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="Enter category"
                >

            </div>


            <!-- Quantity -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    placeholder="Enter quantity"
                >

            </div>


            <!-- Buttons -->

            <button
                id="addButton"
                class="btn-primary"
                onclick="addBook()">

                Add Book

            </button>


            <button
                id="updateButton"
                class="btn-success"
                onclick="updateBook()"
                style="display: none;">

                Update Book

            </button>


            <button
                class="btn-warning"
                onclick="clearForm()">

                Clear

            </button>

        </div>



        <!-- =====================================
             SEARCH BOOKS
        ====================================== -->

        <div class="section">

            <h2>
                Search Books
            </h2>


            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title, author, ISBN or category"
                    onkeyup="searchBooks()"
                >

                <button
                    class="btn-primary"
                    onclick="searchBooks()">

                    Search

                </button>

            </div>

        </div>



        <!-- =====================================
             BOOK TABLE
        ====================================== -->

        <div class="section">

            <h2>
                All Books
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Title
                            </th>

                            <th>
                                Author
                            </th>

                            <th>
                                ISBN
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Quantity
                            </th>

                            <th>
                                Available
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="bookTableBody">

                        <!-- Books will be loaded here -->

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="js/books.js"></script>


</body>

</html>
