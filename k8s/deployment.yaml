apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-management
  template:
    metadata:
      labels:
        app: library-management
    spec:
      containers:
        - name: library-management
          image: library-management-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080