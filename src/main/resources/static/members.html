<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Management - Members</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div class="container">


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar">

        <h2>📚 Library</h2>

        <ul>

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="books.html">
                    Books
                </a>
            </li>

            <li>
                <a href="members.html">
                    Members
                </a>
            </li>

            <li>
                <a href="issue.html">
                    Issue / Return
                </a>
            </li>

        </ul>

    </aside>



    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main-content">


        <!-- TOP BAR -->

        <div class="topbar">

            <h1>
                Member Management
            </h1>

            <span>
                Library Management System
            </span>

        </div>



        <!-- =====================================
             ADD / UPDATE MEMBER FORM
        ====================================== -->

        <div class="form-container">

            <h2>
                Add / Update Member
            </h2>


            <!-- Hidden Member ID -->

            <input
                type="hidden"
                id="memberId"
            >


            <!-- MEMBER NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter member name"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="ACTIVE">
                        Active
                    </option>

                    <option value="INACTIVE">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <button
                id="addButton"
                class="btn-primary"
                onclick="addMember()">

                Add Member

            </button>


            <button
                id="updateButton"
                class="btn-success"
                onclick="updateMember()"
                style="display: none;">

                Update Member

            </button>


            <button
                class="btn-warning"
                onclick="clearMemberForm()">

                Clear

            </button>

        </div>



        <!-- =====================================
             SEARCH MEMBERS
        ====================================== -->

        <div class="section">

            <h2>
                Search Members
            </h2>


            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name, email or phone"
                    onkeyup="searchMembers()"
                >

                <button
                    class="btn-primary"
                    onclick="searchMembers()">

                    Search

                </button>

            </div>

        </div>



        <!-- =====================================
             MEMBER TABLE
        ====================================== -->

        <div class="section">

            <h2>
                All Members
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Member ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="memberTableBody">

                        <!-- Members will be
                             loaded here -->

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="js/members.js"></script>


</body>

</html>
